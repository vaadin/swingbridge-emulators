# Tomcat's request threads must stay PLATFORM threads. SB-Emulators parks a virtual thread on top
# of the request thread for every blocking modal dialog, and that needs a platform carrier
# underneath. Setting this true no longer fails quietly: callSwing refuses at the first
# peer-to-Swing callback with an IllegalStateException naming this property. `false` is Spring
# Boot's own default, so this line changes nothing today — it is here so that a starter, a
# corporate parent pom or a well-meaning performance tweak cannot flip it silently. Do not remove it.
spring.threads.virtual.enabled=false

server.port=8080

# Logback replaces the slf4j-simple a Vaadin Boot app declares; simplelogger.properties has no
# effect here and was deleted with it.
logging.level.root=info
logging.level.com.vaadin.swingbridge=info
logging.level.vaadinx=info
